services:
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    environment:
      MP_MAX_MESSAGES: 1000
      MP_VERBOSE: 'false'
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: fats
      POSTGRES_DB: fats
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in apps/web/.env.local}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - fats-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fats -d fats']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  fats-postgres:

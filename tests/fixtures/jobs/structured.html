<!doctype html>
<html>
  <head>
    <title>Controlled structured posting</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "JobPosting",
            "title": "Graduate Engineer",
            "hiringOrganization": { "name": "Example Philippines" },
            "jobLocation": {
              "@type": "Place",
              "address": { "addressLocality": "Makati", "addressCountry": "PH" }
            },
            "description": "<p>Build useful software.</p><p>Practice teamwork.</p>",
            "jobLocationType": "TELECOMMUTE",
            "baseSalary": {
              "@type": "MonetaryAmount",
              "currency": "PHP",
              "value": {
                "@type": "QuantitativeValue",
                "minValue": 25000,
                "maxValue": 35000,
                "unitText": "MONTH"
              }
            },
            "datePosted": "2026-10-01T23:30:00-04:00",
            "seniority": "Junior",
            "technologies": ["TypeScript", "SQL"],
            "qualifications": "<p>Degree or equivalent experience.</p>"
          }
        ]
      }
    </script>
  </head>
  <body>
    <main>
      <h1>Graduate Engineer</h1>
      <p>Local controlled fixture. No third-party platform is contacted.</p>
    </main>
  </body>
</html>
